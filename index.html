<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101715"><meta name="description" content="Electricity bill manager"><link rel="manifest" href="manifest.webmanifest"><title>E-Bill · Electricity Bills</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf2ed;background:#101715;--muted:#96a39c;--line:#29342f;--panel:#19211d;--green:#c4f079}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 50% -12%,#283b2c 0,transparent 48%),#101715}.app{max-width:520px;min-height:100vh;margin:auto;padding:0 18px calc(34px + env(safe-area-inset-bottom))}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.bolt{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:#182410;font-size:20px}.brandname{display:flex;align-items:baseline;gap:5px;font-size:17px;letter-spacing:-.4px}.brandname small{font-size:9px;font-weight:600;letter-spacing:0;color:var(--muted);vertical-align:sub}.personrow{display:flex;align-items:center}.personrow .personhead{flex:1;min-width:0}.export-row{margin-right:11px;flex:none;border:1px solid #526341;background:#c4f07912;color:#d7edbd;border-radius:9px;padding:8px 9px;font-size:11px;font-weight:800}.muted{color:var(--muted);font-size:12px}.hero{padding:28px 2px 20px}.kicker{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#bce786;margin:0 0 9px}.hero h1{font-size:32px;line-height:1.12;letter-spacing:-1.3px;margin:0}.hero h1 span{color:var(--green)}.hero p:last-child{color:var(--muted);font-size:13px;line-height:1.55;margin:10px 0 0}.total{background:linear-gradient(125deg,#d1f694,#afe66b);color:#1b2814;padding:19px;border-radius:19px;margin-bottom:14px}.totalrow{display:flex;justify-content:space-between}.totallabel{font-size:11px;letter-spacing:1.3px;font-weight:800;opacity:.7}.totalamount{font-size:31px;letter-spacing:-1px;font-weight:800;margin-top:5px}.totalmeta{display:flex;gap:20px;border-top:1px solid #536e373d;padding-top:11px;margin-top:14px;font-size:12px;font-weight:700}.card,.person,.empty{background:var(--panel);border:1px solid var(--line);border-radius:16px}.card{padding:15px;margin-bottom:25px}.cardtitle{display:flex;align-items:center;gap:10px;margin-bottom:14px}.glyph{width:34px;height:34px;border-radius:11px;background:#c4f07917;color:var(--green);display:grid;place-items:center}.cardtitle h2{font-size:15px;margin:0}.cardtitle p{font-size:12px;color:var(--muted);margin:3px 0 0}.new{margin-left:auto;background:var(--green);color:#17220f;border:0;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:7px;color:#aebbb2;font-size:12px;font-weight:700}.field input,.modal input{width:100%;height:43px;padding:0 10px;border:1px solid #344038;border-radius:11px;background:#111814;color:#edf2ed;font-size:15px;outline:none}.field input:focus,.modal input:focus{border-color:#9cc85b}.periodselect{margin-top:12px}.periodselect select{width:100%;height:40px;background:#111814;color:#cdd7cf;border:1px solid #344038;border-radius:10px;padding:0 9px;font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:13px}.sectionhead .kicker{margin-bottom:5px}.sectionhead h2{font-size:21px;margin:0}.count{border-radius:20px;background:#c4f0791a;color:var(--green);font-size:11px;padding:4px 8px;vertical-align:3px}.add{height:36px;padding:0 11px;background:var(--green);color:#17220f;border:0;border-radius:10px;font-size:11px;font-weight:800}.list{display:flex;flex-direction:column;gap:10px}.person{overflow:hidden}.person.open{border-color:#718c53}.personhead{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:13px;display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;flex:none;border-radius:13px;background:#c4f0791c;color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800}.personcopy{flex:1;min-width:0}.personcopy strong{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.personcopy small{font-size:12px;color:var(--muted);display:block;margin-top:4px}.arrow{color:#829087}.details{border-top:1px solid var(--line);padding:14px}.result{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.result div{display:flex;flex-direction:column;gap:4px}.result span{font-size:13px;color:var(--muted)}.result strong{font-size:16px}.final{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.final strong{font-size:19px;color:var(--green)}.actions{display:flex;gap:9px;margin-top:14px}.remove,.export{height:39px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800}.remove{padding:0 10px;background:transparent;color:#e4aaaa;border:1px solid #573c3d}.export{flex:1;color:#17220f;background:var(--green);border:0}.wide{width:100%;margin-top:11px;height:47px;background:#c4f0790b;border:1px dashed #6f8954;border-radius:13px;color:#d8eabb;font-size:13px;font-weight:700}.empty{text-align:center;padding:25px 20px}.empty h3{font-size:15px;margin:12px 0 5px}.empty p{color:var(--muted);font-size:12px;line-height:1.5;margin:0 auto 15px;max-width:260px}.empty button{height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--green);font-weight:800}.foot{text-align:center;color:#758279;font-size:10px;margin:18px 0}.modalbg{position:fixed;inset:0;background:#000a;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:14px}.modal{width:min(100%,480px);padding:20px;background:#1a231e;border:1px solid #36443b;border-radius:22px}.modalhead{display:flex;justify-content:space-between;margin-bottom:19px}.modalhead h2{font-size:21px;margin:0}.close{width:35px;height:35px;border:1px solid var(--line);border-radius:11px;background:#111814;color:#d6e0d8}.modal label{font-size:11px;color:#b7c2b9;font-weight:700}.hint{color:var(--muted);font-size:11px;line-height:1.5}.save{width:100%;height:45px;margin-top:17px;border:0;border-radius:11px;background:var(--green);font-size:12px;font-weight:800}.print{display:none}@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.hero h1{font-size:29px}}@media print{body{background:#fff;color:#111}.app>*{display:none!important}.print{display:block!important;max-width:480px;margin:auto;font-family:Arial,sans-serif}.pdfhead{padding-bottom:15px;border-bottom:2px solid #222;margin-bottom:20px}.pdfhead h1{font-size:24px;margin:16px 0 4px}.pdfhead p{font-size:12px;color:#555}.print h2{font-size:18px;margin:22px 0 14px}.pdfline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd;font-size:13px}.pdftotal{display:flex;justify-content:space-between;margin-top:14px;padding:14px 0;border-top:2px solid #222;font-size:15px;font-weight:700}.pdftotal strong{font-size:20px}.thanks{text-align:center;margin-top:35px;font-size:10px;color:#666}}
.total,.card,.person,.empty{animation:slideFade .34s ease both}.person:nth-child(2){animation-delay:.03s}.person:nth-child(3){animation-delay:.06s}.person:nth-child(4){animation-delay:.09s}.details{animation:slideFade .22s ease both}.modalbg{animation:fadeIn .18s ease both}.modal{animation:modalUp .24s cubic-bezier(.2,.8,.2,1) both}.new,.add,.wide,.export-row,.remove,.save{transition:transform .15s ease,filter .15s ease,background-color .15s ease}.new:active,.add:active,.wide:active,.export-row:active,.remove:active,.save:active{transform:scale(.97);filter:brightness(1.08)}.personhead:active{background:#ffffff08}@keyframes slideFade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes modalUp{from{opacity:.7;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><div class="app" id="app"></div>
<script>
(function(){
const KEY='wattwise-app-v1',today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.periods))data={users:[],periods:[{id:uid(),date:today(),price:0,readings:{}}]};
let active=data.periods[0].id,expanded='',modal='',printUser='';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateText=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Choose date';
const current=()=>data.periods.find(p=>p.id===active)||data.periods[0],read=(p,id)=>p.readings[id]||{current:0,previous:0};
const units=r=>Number(r.current||0)-Number(r.previous||0),amount=(r,p)=>units(r)*Number(p||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function draw(){const p=current();let u=0,total=0;data.users.forEach(x=>{let r=read(p,x.id);u+=units(r);total+=amount(r,p.price)});
let html='<header class="top"><div class="brand"><span class="bolt">ϟ</span><span class="brandname">E-Bill<small>by PG</small></span></div><span class="muted">Saved on this device</span></header><main><section class="total"><div class="totalrow"><div><div class="totallabel">TOTAL BILL</div><div class="totalamount" id="summary-total">'+money(total)+'</div></div><div class="glyph">▤</div></div><div class="totalmeta"><span id="summary-units">ϟ &nbsp;'+u+' units</span><span id="summary-users">♙ &nbsp;'+data.users.length+' users</span></div></section><section class="card"><div class="cardtitle"><span class="glyph">▦</span><div><h2>Billing period</h2><p>Select or create a bill period</p></div><button class="new" id="new">＋ New</button></div><div class="grid"><label class="field">Bill date<input id="date" type="date" value="'+p.date+'"></label><label class="field">Unit price<input id="price" type="number" min="0" step="0.01" inputmode="decimal" value="'+p.price+'"></label></div>';
if(data.periods.length>1)html+='<label class="field periodselect">Billing period<select id="choose">'+data.periods.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+dateText(x.date)+' · '+money(x.price)+'/unit</option>').join('')+'</select></label>';
html+='</section><section><div class="sectionhead"><div><p class="kicker">THIS BILL</p><h2>Users <span class="count">'+data.users.length+'</span></h2></div><button class="add" id="add">＋ Add user</button></div>';
if(data.users.length){html+='<div class="list">'+data.users.map(x=>{let r=read(p,x.id),open=expanded===x.id;return '<article class="person '+(open?'open':'')+'"><div class="personrow"><button class="personhead" data-open="'+x.id+'"><span class="avatar">'+x.name.trim().split(/\s+/).map(y=>y[0]).slice(0,2).join('').toUpperCase()+'</span><span class="personcopy"><strong>'+esc(x.name)+'</strong><small data-summary="'+x.id+'">'+units(r)+' units · '+money(amount(r,p.price))+'</small></span><span class="arrow">›</span></button><button class="export-row" data-export="'+x.id+'">PDF</button></div>'+(open?'<div class="details"><div class="grid"><label class="field">Previous reading<input data-reading="previous" data-id="'+x.id+'" type="number" inputmode="decimal" min="0" value="'+r.previous+'"></label><label class="field">Current reading<input data-reading="current" data-id="'+x.id+'" type="number" inputmode="decimal" min="0" value="'+r.current+'"></label></div><div class="result"><div><span>Total units</span><strong data-user-units="'+x.id+'">'+units(r)+' units</strong></div><div><span>Unit price</span><strong data-user-price="'+x.id+'">'+money(p.price)+'</strong></div></div><div class="final"><span>Total price</span><strong data-user-total="'+x.id+'">'+money(amount(r,p.price))+'</strong></div><div class="actions"><button class="remove" data-remove="'+x.id+'">Remove user</button></div></div>':'')+'</article>'}).join('')+'</div><button class="wide" id="addmore">＋ &nbsp; Add another user</button>'}
else html+='<div class="empty"><span class="glyph">♙</span><h3>Add your first user</h3><p>Create a user to enter meter readings and calculate their bill.</p><button id="addfirst">＋ Add user</button></div>';
html+='</section><p class="foot">Your users and billing periods stay saved on this device.</p></main>';
if(modal)html+=modalView();
html+='<div class="print">'+printView()+'</div>';document.getElementById('app').innerHTML=html;bind()}
function modalView(){if(modal==='user')return '<div class="modalbg" id="backdrop"><section class="modal"><div class="modalhead"><div><p class="kicker">HOUSEHOLD</p><h2>Add a user</h2></div><button class="close" id="close">×</button></div><label class="field">User name<input id="name" placeholder="Enter a name"></label><button class="save" id="saveuser">Add user</button></section></div>';
return '<div class="modalbg" id="backdrop"><section class="modal"><div class="modalhead"><div><p class="kicker">BILLING</p><h2>New billing period</h2></div><button class="close" id="close">×</button></div><div class="grid"><label class="field">Bill date · today by default<input id="newdate" type="date" value="'+today()+'"></label><label class="field">Unit price (₹)<input id="newprice" type="number" min="0" step="0.01" inputmode="decimal" value="'+(data.periods[0].price||'')+'" placeholder="e.g. 6.21"></label></div><p class="hint">Each previous reading starts from the latest period’s current reading.</p><button class="save" id="saveperiod">Create billing period</button></section></div>'}
function printView(){let x=data.users.find(y=>y.id===printUser);if(!x)return'';let p=current(),r=read(p,x.id);return '<article class="pdf"><div class="pdfhead"><strong>ϟ &nbsp; E-BILL <small>by PG</small></strong><h1>Electricity bill</h1><p>'+dateText(p.date)+'</p></div><h2>'+esc(x.name)+'</h2><div class="pdfline"><span>Previous reading</span><strong>'+r.previous+'</strong></div><div class="pdfline"><span>Current reading</span><strong>'+r.current+'</strong></div><div class="pdfline"><span>Total units</span><strong>'+units(r)+' units</strong></div><div class="pdfline"><span>Unit price</span><strong>'+money(p.price)+' / unit</strong></div><div class="pdftotal"><span>Total price</span><strong>'+money(amount(r,p.price))+'</strong></div><p class="thanks">Thank you</p></article>'}
function refreshValues(){
const p=current();let allUnits=0,allAmount=0;
data.users.forEach(x=>{
const r=read(p,x.id),u=units(r),bill=amount(r,p.price);allUnits+=u;allAmount+=bill;
const row=document.querySelector('[data-summary="'+x.id+'"]');if(row)row.textContent=u+' units · '+money(bill);
const unitNode=document.querySelector('[data-user-units="'+x.id+'"]');if(unitNode)unitNode.textContent=u+' units';
const priceNode=document.querySelector('[data-user-price="'+x.id+'"]');if(priceNode)priceNode.textContent=money(p.price);
const totalNode=document.querySelector('[data-user-total="'+x.id+'"]');if(totalNode)totalNode.textContent=money(bill);
});
const totalNode=document.getElementById('summary-total');if(totalNode)totalNode.textContent=money(allAmount);
const unitsNode=document.getElementById('summary-units');if(unitsNode)unitsNode.textContent='ϟ  '+allUnits+' units';
const option=document.querySelector('#choose option[value="'+p.id+'"]');if(option)option.textContent=dateText(p.date)+' · '+money(p.price)+'/unit';
}
function bind(){
['add','addmore','addfirst'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>{modal='user';draw();document.getElementById('name').focus()}));
document.getElementById('new')?.addEventListener('click',()=>{modal='period';draw()});
document.getElementById('close')?.addEventListener('click',()=>{modal='';draw()});
document.getElementById('backdrop')?.addEventListener('click',e=>{if(e.target.id==='backdrop'){modal='';draw()}});
document.getElementById('saveuser')?.addEventListener('click',()=>{let name=document.getElementById('name').value.trim();if(!name)return;let id=uid();data.users.push({id,name});data.periods.forEach((p,i)=>p.readings[id]={previous:i?Number(data.periods[i-1].readings[id]?.current||0):0,current:0});expanded=id;modal='';save();draw()});
document.getElementById('name')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('saveuser').click()});
document.getElementById('saveperiod')?.addEventListener('click',()=>{let date=document.getElementById('newdate').value,price=document.getElementById('newprice').value;if(!date||price===''||Number(price)<0)return;let latest=data.periods[0],readings={};data.users.forEach(x=>{let v=Number(latest.readings[x.id]?.current||0);readings[x.id]={previous:v,current:v}});let p={id:uid(),date,price:Number(price),readings};data.periods.unshift(p);active=p.id;expanded='';modal='';save();draw()});
document.getElementById('date')?.addEventListener('input',e=>{current().date=e.target.value;save();refreshValues()});
document.getElementById('price')?.addEventListener('input',e=>{current().price=Number(e.target.value)||0;save();refreshValues()});
document.getElementById('choose')?.addEventListener('change',e=>{active=e.target.value;expanded='';draw()});
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{expanded=expanded===b.dataset.open?'':b.dataset.open;draw()}));
document.querySelectorAll('[data-reading]').forEach(el=>el.addEventListener('input',e=>{current().readings[e.target.dataset.id][e.target.dataset.reading]=Number(e.target.value)||0;save();refreshValues()}));
document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{let x=data.users.find(y=>y.id===b.dataset.remove);if(!x||!confirm('Remove '+x.name+' and their readings from every period?'))return;data.users=data.users.filter(y=>y.id!==x.id);data.periods.forEach(p=>delete p.readings[x.id]);expanded='';save();draw()}));
document.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click',()=>{printUser=b.dataset.export;draw();setTimeout(()=>window.print(),100)}))
}
window.addEventListener('afterprint',()=>{printUser='';draw()});draw();if('serviceWorker'in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
